name: pia-asistente

# The link proxy is the only way out of the plant network, so every service that talks to
# the plant network carries the same three variables.
x-proxy: &plant-proxy
  HTTP_PROXY: http://enlace:3128
  HTTPS_PROXY: http://enlace:3128
  NO_PROXY: broker,sim,localhost

x-plant-service: &plant-service
  networks: [planta-lan]
  labels:
    academia.planta: pc
  environment: *plant-proxy

services:
  cerebro:
    image: pia-asistente-cerebro:latest
    build:
      context: .
      additional_contexts:
        contrato: ${PLANTA_CONTRATO_DIR:-.}
    <<: *plant-service
    environment:
      <<: *plant-proxy
      SISTEMA_NOMBRE: ${SISTEMA_NOMBRE:-Academia Novit}
      MQTT_HOST: broker
      MQTT_PORT: "1883"
      PLANT_URL: http://sim:8100
      LINK_CONTROL_URL: http://enlace:8081
      DATABASE_URL: postgresql://${POSTGRES_USER:-pia}:${POSTGRES_PASSWORD:-pia-local-dev}@db:5432/${POSTGRES_DB:-pia}
      MEDIA_DIR: /data/media
      CLOUD_SYNC_URL: http://nube-sync:8300
      LLM_ENABLED: ${LLM_ENABLED:-false}
      ASR_MODEL: /models/faster-whisper-small
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      NOTE_TIMEOUT_S: ${NOTE_TIMEOUT_S:-180}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-6}
      MAX_NOTE_STEPS: ${MAX_NOTE_STEPS:-8}
      TOKEN_BUDGET: ${TOKEN_BUDGET:-8000}
      # Vision (Entrega 2): the photos are analysed in the NVIDIA cloud through the link
      # proxy. Leaving the key empty keeps the analysis queued; the safety alert never
      # depends on it.
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_MODEL: ${VISION_MODEL:-meta/llama-3.2-11b-vision-instruct}
      VISION_BASE_URL: ${VISION_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      VISION_TIMEOUT_S: ${VISION_TIMEOUT_S:-45}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - assistant-media:/data/media
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 6g
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    <<: *plant-service
    environment:
      <<: *plant-proxy
      POSTGRES_DB: ${POSTGRES_DB:-pia}
      POSTGRES_USER: ${POSTGRES_USER:-pia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pia-local-dev}
    volumes:
      - assistant-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pia} -d ${POSTGRES_DB:-pia}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g
    restart: unless-stopped

  # Control-network ingress for the UI. It is a plant service (it runs on the plant PC
  # and carries the label) and the single documented deviation from "only on
  # planta-lan": planta-lan is `internal`, so Docker cannot publish a port from a
  # container that is only on it. It holds no state and proxies every request to
  # cerebro, which (like `db`) does stay only on planta-lan.
  panel:
    image: nginx:1.27-alpine
    networks: [planta-lan, control]
    labels:
      academia.planta: pc
    environment: *plant-proxy
    volumes:
      - ./deploy/panel.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8200:80"
    depends_on:
      - cerebro
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m
    restart: unless-stopped

  # Cloud-side replica. It is outside the plant PC and behind the link proxy, so it is
  # never needed for local detection or safety alerts. It still carries a cap so the
  # whole stack stays inside 4 CPU / 8 GB when both sides run on the same host.
  nube-sync:
    build:
      context: ./cloud
    networks: [control]
    ports:
      - "${CLOUD_PORT:-8300}:8300"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
    restart: unless-stopped

networks:
  planta-lan:
    external: true
  control:
    external: true
    name: ${PLANTA_RED:-planta}-control

volumes:
  assistant-db:
  assistant-media:
